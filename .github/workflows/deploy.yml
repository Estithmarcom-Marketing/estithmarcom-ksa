name: Deploy Frontend to Test Server
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/estithmarcomegypt-sys/estithmarcom-ksa:latest
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://test.api.estithmarcom.com/api/v1/website
            CHAT_WIDGET_ORIGIN=https://chat-stage.estithmarcom.com
            NEXT_PUBLIC_CHAT_WIDGET_ENABLED=false
      - name: Deploy to Test Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u estithmarcomegypt-sys --password-stdin
            cd ~/projects/estithmarcom-ksa/web
            docker compose pull
            docker compose up -d --force-recreate
      - name: Cleanup old Docker images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker image prune -a -f --filter "until=24h"
